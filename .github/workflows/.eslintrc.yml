name: Lint Codebase

on:
  pull_request: {}

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx run lint:js

      - name: Lint LESS
        run: npm run lint:less

      - name: Lint Handlebars
        run: npm run lint:hbs

      - name: Check Handlebars and LESS Prettier formatting
        run: npm run format:check
